name: release

on:
  push:
    tags: ['v*.*.*', 'v*.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  platforms:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List platforms
        id: list
        run: echo "list=$(make platforms | jq -R -c '[splits(" +")]')" >> "$GITHUB_OUTPUT"

  # One runner per platform. The jobs run at the same time.
  build:
    needs: platforms
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: ${{ fromJSON(needs.platforms.outputs.list) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Check build deps
        run: make check-build-deps

      - name: Build ${{ matrix.platform }}
        run: make build VERSION=${{ github.ref_name }} PLATFORMS=${{ matrix.platform }}

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ strategy.job-index }}
          retention-days: 1
          if-no-files-found: error
          path: |
            build/release/*/*.zip
            build/release/checksums.txt

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download builds
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: build/release

      - name: Merge checksums
        working-directory: build/release
        run: |
          cat release-*/checksums.txt | LC_ALL=C sort > checksums.txt
          ls -R
          cat checksums.txt

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/release/**/*.zip
            build/release/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # llm-packages rebuilds Scoop, Homebrew, Nix, APT, RPM, APK and FreeBSD packages from the latest release.
      - name: Update package repositories
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_DISPATCH_TOKEN }}
        run: gh api repos/TheSlopMachine/llm-packages/dispatches -f event_type=release
